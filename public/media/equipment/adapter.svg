<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="USB-C çoxportlu adapter">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F3BF"/>
      <stop offset="1" stop-color="#D3E8BF"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b5f63"/>
      <stop offset="1" stop-color="#2f3235"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8f94"/>
      <stop offset="1" stop-color="#5b5f63"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#16423C" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="480" height="360" fill="url(#bg)"/>
  <g fill="none" stroke="#44766C" stroke-opacity=".18" stroke-width="2">
    <circle cx="420" cy="60" r="70"/><circle cx="420" cy="60" r="40"/>
    <path d="M0 300 h120 a40 40 0 0 1 40 40 v20"/>
  </g>
  <!-- kabel -->
  <path d="M110 214 C 60 214, 60 140, 120 130 S 190 96, 196 70" fill="none" stroke="#2f3235" stroke-width="12" stroke-linecap="round"/>
  <g transform="translate(176 40) rotate(-12)">
    <rect x="0" y="0" width="40" height="34" rx="8" fill="url(#top)"/>
    <rect x="9" y="-14" width="22" height="16" rx="5" fill="#c9ccd0"/>
    <rect x="13" y="-11" width="14" height="5" rx="2.5" fill="#6e7378"/>
  </g>
  <!-- gövdə -->
  <g filter="url(#sh)">
    <rect x="104" y="180" width="300" height="76" rx="22" fill="url(#body)"/>
    <rect x="104" y="180" width="300" height="20" rx="10" fill="#ffffff" fill-opacity=".08"/>
  </g>
  <!-- portlar -->
  <g transform="translate(150 206)">
    <path d="M0 4 h44 v14 l-6 6 h-32 l-6 -6 z" fill="#1d1f21" stroke="#9aa0a6" stroke-width="2"/>
    <text x="22" y="44" font-family="Poppins, Tahoma, sans-serif" font-size="11" fill="#F0F3BF" text-anchor="middle">HDMI</text>
  </g>
  <g transform="translate(218 206)">
    <rect x="0" y="4" width="36" height="18" rx="2" fill="#1d1f21" stroke="#9aa0a6" stroke-width="2"/>
    <rect x="6" y="9" width="24" height="5" fill="#44766C"/>
    <text x="18" y="44" font-family="Poppins, Tahoma, sans-serif" font-size="11" fill="#F0F3BF" text-anchor="middle">USB-A</text>
  </g>
  <g transform="translate(270 206)">
    <rect x="0" y="4" width="36" height="18" rx="2" fill="#1d1f21" stroke="#9aa0a6" stroke-width="2"/>
    <rect x="6" y="9" width="24" height="5" fill="#44766C"/>
    <text x="18" y="44" font-family="Poppins, Tahoma, sans-serif" font-size="11" fill="#F0F3BF" text-anchor="middle">USB-A</text>
  </g>
  <g transform="translate(322 206)">
    <rect x="0" y="6" width="30" height="13" rx="6.5" fill="#1d1f21" stroke="#9aa0a6" stroke-width="2"/>
    <text x="15" y="44" font-family="Poppins, Tahoma, sans-serif" font-size="11" fill="#F0F3BF" text-anchor="middle">USB-C</text>
  </g>
  <circle cx="380" cy="198" r="3.5" fill="#D3E8BF"/>
</svg>
